<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5faf8"><title>沧海出行</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="style.css?v=clean1"></head><body>
<main><header><img src="assets/crew/dog.jpg" alt="" width="40" height="40"><h1>沧海出行</h1><span id="connection" role="status">连接中</span></header>
<section class="toolbar" aria-label="查找公交"><div class="search"><input id="route-search" type="search" aria-label="搜索线路或地点" placeholder="搜索线路 / 地点" autocomplete="off"><div id="route-options" role="group" aria-label="搜索结果" hidden></div></div><button id="locate">定位</button><button id="nearest-stop">站点</button></section>
<div class="selection-row"><div id="selected-routes" aria-label="已选线路"></div><button id="clear-routes" class="text-button" aria-label="清空已选线路">清空</button></div>
<section id="nearby-panel" class="card nearby" aria-label="附近站点" hidden><div class="boarding-controls"><select id="boarding-route" aria-label="乘坐线路"><option value="">选择线路</option></select><select id="boarding-direction" aria-label="目的地方向" disabled><option value="">选择方向</option></select><button id="find-boarding" disabled>找站</button></div><p id="nearby-title" class="muted"></p><div id="nearby-options" aria-label="附近站点"></div></section>
<section class="map-wrap" aria-label="公交地图"><div id="map"></div><button id="fit" class="map-fit" aria-label="显示全部已选车辆">看全</button><div id="bus-count"></div><div id="location-status" role="status"></div></section>
<section id="vehicles" class="vehicles" aria-label="实时车辆"></section>
<div class="life"><section class="card"><h2><img src="assets/crew/hamster.jpg" alt="">天气</h2><div id="weather">读取中…</div></section><section class="card"><h2><img src="assets/crew/gentleman.jpg" alt="">汇率</h2><div id="fx">读取中…</div><label>MYR<input id="amount" aria-label="令吉金额" type="number" min="0" step="1" value="1000"></label><p id="conversion"></p></section></div>
<footer><span>沧海</span><details><summary aria-label="作者的小角落">✦</summary><figure><img src="assets/crew/author.jpg" alt="作者的牛仔照片" loading="lazy"><figcaption>祝你每次出门，都刚好赶上。</figcaption></figure></details></footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script type="module" src="js/app.js?v=clean1"></script></body></html>
