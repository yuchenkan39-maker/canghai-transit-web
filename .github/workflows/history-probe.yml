name: Inspect public historical data
on:
  push:
    paths: ['.github/workflows/history-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests pyarrow fsspec aiohttp
      - name: Inspect published parquet
        shell: python
        run: |
          import requests, fsspec, pyarrow.parquet as pq
          url='https://kri-public-data.s3.ap-southeast-1.amazonaws.com/GTFS/vehicle_positions/year%3D2026/vehicle_positions_202604.parquet'
          r=requests.head(url,timeout=30)
          print('HEAD',r.status_code,dict(r.headers))
          r.raise_for_status()
          with fsspec.open(url,'rb',block_size=1024*1024) as f:
            p=pq.ParquetFile(f)
            print('SCHEMA',p.schema)
            print('ROWS',p.metadata.num_rows,'GROUPS',p.num_row_groups)
            for i in [0,p.num_row_groups//2,p.num_row_groups-1]:
              g=p.metadata.row_group(i)
              print('GROUP',i,'rows',g.num_rows,'bytes',g.total_byte_size)
            t=p.read_row_group(0,columns=['timestamp','route_id','latitude','longitude','vehicle_id','bearing','speed'])
            print('SAMPLE',t.slice(0,5).to_pylist())
